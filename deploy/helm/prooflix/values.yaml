# Prooflix keeps run history in memory (mirrored to the volume) and runs the
# cron scheduler inside the server, so it must run as exactly one pod.
# There is deliberately no replicaCount value.

image:
  repository: prooflix
  tag: ""          # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

prooflix:
  scheduler: true    # run pipelines on their cron schedules
  maxDepth: 10       # maximum sub-pipeline nesting depth
  extraEnv: []       # more environment variables, e.g. for pipeline code
  #  - name: MY_SETTING
  #    value: "x"

# Source data: the raw files pipelines read (bronze's input), PROOFLIX_SOURCE_DATA.
# Each workspace's source/ folder becomes a link to it; a workspace can still
# choose its own folder in the web client. Prooflix never writes to it, so its
# volume is mounted read-only.
sourceData:
  path: ""           # "" = volume.mountPath when the volume is enabled, else each workspace's own source/
  volume:
    enabled: false   # mount a volume holding the source files
    mountPath: /source-data
    readOnly: true
    size: 100Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    existingClaim: ""  # use a PVC you created yourself (usually one already holding the files)

# The data lake: what pipelines build, data/<catalog>/<schema>/<table>/ (bronze,
# gold) and their checkpoints, data/<catalog>/checkpoint/; the catalog and the SQL
# editor read it. PROOFLIX_DATA_LAKE. Each workspace's data/ folder becomes a link
# to it. Data lakes get big, so they can have a volume of their own.
dataLake:
  path: ""           # "" = volume.mountPath when the volume is enabled, else each workspace's own data/ (on the main volume)
  volume:
    enabled: false   # mount a separate volume for the data lake
    mountPath: /datalake
    size: 100Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    existingClaim: ""  # use a PVC you created yourself (e.g. one bound to existing data)

# Workspace (imported projects, run history) and catalog, mounted at /data.
persistence:
  enabled: true      # false: an emptyDir, so everything is lost when the pod goes
  size: 10Gi
  storageClass: ""   # "" uses the cluster's default StorageClass
  accessModes:
    - ReadWriteOnce
  existingClaim: ""  # use a PVC you created yourself

service:
  type: ClusterIP
  port: 8000

# Prooflix has no login: anyone who reaches it can import and run code.
# Keep the Ingress internal, or use `kubectl port-forward`.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: prooflix.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
