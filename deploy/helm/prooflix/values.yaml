# Prooflix keeps run history in memory (mirrored to the volume) and runs the
# cron scheduler inside the server, so it must run as exactly one pod.
# There is deliberately no replicaCount value.

image:
  repository: prooflix
  tag: ""          # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

prooflix:
  scheduler: true    # run pipelines on their cron schedules
  maxDepth: 10       # maximum sub-pipeline nesting depth
  startDate: ""      # where data processing starts when the system is initialized,
                     # e.g. "2026-01-01" (PROOFLIX_START_DATE); "" = all data
  extraEnv: []       # more environment variables, e.g. for pipeline code
  #  - name: MY_SETTING
  #    value: "x"

# Spark: the execution engine inside pipeline tasks (Prooflix orchestrates, Spark
# runs the work). The image has Java 17, PySpark and the Spark packages (Delta,
# Unity Catalog, Avro); tasks share one Spark session in the server process, in
# local mode, so give the pod the memory Spark needs (resources, below).
spark:
  master: "local[*]"     # PROOFLIX_SPARK_MASTER
  driverMemory: 4g       # PROOFLIX_SPARK_DRIVER_MEMORY; keep below resources.limits.memory
  conf: {}               # more Spark settings, PROOFLIX_SPARK_CONF
  #  spark.sql.shuffle.partitions: "64"

# Unity Catalog: where the Delta tables are registered (tenant catalog, schemas
# bronze/silver/gold). The chart runs the open-source server next to Prooflix;
# set uri to use one that runs elsewhere instead.
unityCatalog:
  enabled: true          # run the Unity Catalog server in this release
  uri: ""                # "" = the server of this release; or e.g. https://uc.internal
  token: ""              # PROOFLIX_UC_TOKEN, when the server needs one
  catalog: tenant1       # PROOFLIX_UC_CATALOG: the tenant catalog
  image:
    repository: unitycatalog/unitycatalog
    tag: v0.7.0
    pullPolicy: IfNotPresent
  port: 8080
  persistence:           # the server's metadata database
    enabled: true
    size: 1Gi
    storageClass: ""
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# PostgreSQL of InsightIQ's object model: versions of published types, actions' edits and
# the audit log. On by default; or turn it off and give your own database with externalUrl.
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16.4-alpine"
    pullPolicy: IfNotPresent
  auth:
    user: prooflix
    database: prooflix
    password: ""           # "" = generated once and kept in the Secret
    existingSecret: ""     # or a Secret you made, with the key "password"
  # with enabled: false, a database of your own: postgresql://host:5432/db (no user or password in
  # it), with user and a Secret holding its password (key "password") in auth.existingSecret
  externalUrl: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# OpenSearch for the object model's fast search (types with "Fast search" on). On by default; or
# turn it off and give your own with externalUrl (and user / a Secret with key "password").
opensearch:
  enabled: true
  image:
    repository: opensearchproject/opensearch
    tag: "2.19.1"
    pullPolicy: IfNotPresent
  javaOpts: "-Xms1g -Xmx1g"
  externalUrl: ""          # with enabled: false, e.g. https://search.internal:9200
  auth:
    user: ""               # for an external OpenSearch with its security on
    existingSecret: ""     # a Secret with key "password"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      memory: 3Gi

# ClickHouse: the ClickHouse tab copies gold tables here, with the same columns and
# types, for people outside Prooflix to query. Prooflix writes as auth.user; outside
# users connect as auth.readerUser, which can only SELECT (readonly profile).
clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "26.8.30"         # 26.8 LTS
    pullPolicy: IfNotPresent
  auth:
    user: prooflix         # the user Prooflix creates and loads tables with
    password: ""           # "" = generated once and kept in the Secret
    readerUser: reader     # read-only, for queries from outside
    readerPassword: ""     # "" = generated once and kept in the Secret
    existingSecret: ""     # or a Secret you made, with keys "password" and "reader-password"
  # How people outside the cluster reach it. ClusterIP: use kubectl port-forward;
  # NodePort or LoadBalancer: reachable on the network (keep it internal).
  service:
    type: ClusterIP
    httpPort: 8123         # HTTP interface (curl, JDBC/ODBC drivers, BI tools)
    nativePort: 9000       # native protocol (clickhouse-client)
    httpNodePort: ""       # with type NodePort, e.g. 30123
    nativeNodePort: ""     # with type NodePort, e.g. 30900
    annotations: {}        # e.g. an internal load balancer annotation
  publicUrl: ""            # shown in the ClickHouse tab, e.g. http://clickhouse.internal:8123
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    existingClaim: ""
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 4Gi

# Source data: the raw files pipelines read (bronze's input), PROOFLIX_SOURCE_DATA.
# Each workspace's source/ folder becomes a link to it; a workspace can still
# choose its own folder in the web client. Prooflix never writes to it, so its
# volume is mounted read-only.
sourceData:
  path: ""           # "" = volume.mountPath when the volume is enabled, else each workspace's own source/
  volume:
    enabled: false   # mount a volume holding the source files
    mountPath: /source-data
    readOnly: true
    size: 100Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    existingClaim: ""  # use a PVC you created yourself (usually one already holding the files)

# The data lake: what pipelines build, data/<catalog>/<schema>/<table>/ (bronze,
# gold) and their checkpoints, data/<catalog>/checkpoint/; the catalog and the SQL
# editor read it. PROOFLIX_DATA_LAKE. Each workspace's data/ folder becomes a link
# to it. Data lakes get big, so they can have a volume of their own.
dataLake:
  path: ""           # "" = volume.mountPath when the volume is enabled, else each workspace's own data/ (on the main volume)
  volume:
    enabled: false   # mount a separate volume for the data lake
    mountPath: /datalake
    size: 100Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    existingClaim: ""  # use a PVC you created yourself (e.g. one bound to existing data)

# Workspace (imported projects, run history) and catalog, mounted at /data.
persistence:
  enabled: true      # false: an emptyDir, so everything is lost when the pod goes
  size: 10Gi
  storageClass: ""   # "" uses the cluster's default StorageClass
  accessModes:
    - ReadWriteOnce
  existingClaim: ""  # use a PVC you created yourself

service:
  type: ClusterIP
  port: 8000

# Everyone signs in (the first start creates the first admin; PROOFLIX_AUTH=0 in
# prooflix.extraEnv turns it off, deliberately not a value). Users with the Workspace
# or System tab can change code or configuration that runs on the server: give
# those tabs only to trusted people, and keep the Ingress internal.
ingress:
  enabled: false
  # addresses whose X-Forwarded-Proto/For the server trusts (the ingress controller);
  # "*" is fine when only the ingress can reach the pod
  forwardedAllowIps: "*"
  className: ""
  annotations: {}
  hosts:
    - host: prooflix.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Spark runs inside this pod: the limit must cover spark.driverMemory plus the server.
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 6Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
