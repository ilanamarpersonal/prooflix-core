apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prooflix.fullname" . }}
  labels:
    {{- include "prooflix.labels" . | nindent 4 }}
spec:
  # One pod only: run history and the scheduler live in the server process.
  replicas: 1
  # The volume is ReadWriteOnce and two servers would run every schedule twice,
  # so stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "prooflix.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "prooflix.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # No Kubernetes service variables (<RELEASE>_SERVICE_HOST, ...): with a release
      # named e.g. "prooflix-spark" they would look like PROOFLIX_SPARK_* settings.
      # Services are reached by DNS name.
      enableServiceLinks: false
      # Let running pipelines finish their current step on shutdown
      terminationGracePeriodSeconds: 60
      containers:
        - name: prooflix
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PROOFLIX_WORKSPACES
              value: /data/workspaces
            - name: PROOFLIX_CATALOG
              value: /data/catalog
            # the workspace list and the active workspace, kept on the volume
            - name: PROOFLIX_HOME
              value: /data/.prooflix
            - name: PROOFLIX_SCHEDULER
              value: {{ ternary "1" "0" .Values.prooflix.scheduler | quote }}
            - name: PROOFLIX_MAX_DEPTH
              value: {{ .Values.prooflix.maxDepth | quote }}
            {{- with .Values.prooflix.startDate }}
            # pipelines with no checkpoint yet process data from this date on
            - name: PROOFLIX_START_DATE
              value: {{ . | quote }}
            {{- end }}
            {{- with include "prooflix.sourceDataPath" . }}
            # every workspace's source/ links here (sourceData in values.yaml)
            - name: PROOFLIX_SOURCE_DATA
              value: {{ . | quote }}
            {{- end }}
            {{- with include "prooflix.dataLakePath" . }}
            # every workspace's data/ links here (dataLake in values.yaml)
            - name: PROOFLIX_DATA_LAKE
              value: {{ . | quote }}
            {{- end }}
            # Spark, the execution engine of pipeline tasks (spark in values.yaml)
            - name: PROOFLIX_SPARK_MASTER
              value: {{ .Values.spark.master | quote }}
            - name: PROOFLIX_SPARK_DRIVER_MEMORY
              value: {{ .Values.spark.driverMemory | quote }}
            {{- with .Values.spark.conf }}
            - name: PROOFLIX_SPARK_CONF
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with include "prooflix.unityCatalogUri" . }}
            # where the Delta tables are registered (unityCatalog in values.yaml)
            - name: PROOFLIX_UC_URI
              value: {{ . | quote }}
            {{- end }}
            - name: PROOFLIX_UC_CATALOG
              value: {{ .Values.unityCatalog.catalog | quote }}
            {{- with .Values.unityCatalog.token }}
            - name: PROOFLIX_UC_TOKEN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.prooflix.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.sourceData.volume.enabled }}
            - name: source-data
              mountPath: {{ .Values.sourceData.volume.mountPath }}
              readOnly: {{ .Values.sourceData.volume.readOnly }}
            {{- end }}
            {{- if .Values.dataLake.volume.enabled }}
            - name: datalake
              mountPath: {{ .Values.dataLake.volume.mountPath }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "prooflix.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.sourceData.volume.enabled }}
        - name: source-data
          persistentVolumeClaim:
            claimName: {{ include "prooflix.sourceDataClaimName" . }}
            readOnly: {{ .Values.sourceData.volume.readOnly }}
        {{- end }}
        {{- if .Values.dataLake.volume.enabled }}
        - name: datalake
          persistentVolumeClaim:
            claimName: {{ include "prooflix.dataLakeClaimName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
