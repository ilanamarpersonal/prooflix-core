apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prooflix.fullname" . }}
  labels:
    {{- include "prooflix.labels" . | nindent 4 }}
spec:
  # One pod only: run history and the scheduler live in the server process.
  replicas: 1
  # The volume is ReadWriteOnce and two servers would run every schedule twice,
  # so stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "prooflix.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "prooflix.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Let running pipelines finish their current step on shutdown
      terminationGracePeriodSeconds: 60
      containers:
        - name: prooflix
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PROOFLIX_WORKSPACE
              value: /data/workspace
            - name: PROOFLIX_CATALOG
              value: /data/catalog
            # the workspace list and the active workspace, kept on the volume
            - name: PROOFLIX_HOME
              value: /data/.prooflix
            - name: PROOFLIX_SCHEDULER
              value: {{ ternary "1" "0" .Values.prooflix.scheduler | quote }}
            - name: PROOFLIX_MAX_DEPTH
              value: {{ .Values.prooflix.maxDepth | quote }}
            {{- with .Values.prooflix.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "prooflix.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
