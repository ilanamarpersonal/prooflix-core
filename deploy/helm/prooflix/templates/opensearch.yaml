{{- if .Values.opensearch.enabled }}
{{- $name := include "prooflix.opensearchName" . }}
# OpenSearch for the object model's fast search: one node, data on its own volume. Its security
# plugin is off, so only the Prooflix server may reach it (the NetworkPolicy below) and the Service
# is never exposed outside the cluster. The index is a copy that Prooflix can always rebuild.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "prooflix.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "prooflix.opensearchSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prooflix.opensearchSelectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000      # the opensearch user in the image
      containers:
        - name: opensearch
          image: "{{ .Values.opensearch.image.repository }}:{{ .Values.opensearch.image.tag }}"
          imagePullPolicy: {{ .Values.opensearch.image.pullPolicy }}
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: {{ .Values.opensearch.javaOpts | quote }}
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.opensearch.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
      {{- if not .Values.opensearch.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.opensearch.persistence.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete     # an index can always be rebuilt from the lake
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.opensearch.persistence.size }}
        {{- with .Values.opensearch.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "prooflix.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: http
  selector:
    {{- include "prooflix.opensearchSelectorLabels" . | nindent 4 }}
---
# Only the Prooflix server talks to OpenSearch (its security plugin is off)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "prooflix.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  podSelector:
    matchLabels:
      {{- include "prooflix.opensearchSelectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "prooflix.selectorLabels" . | nindent 14 }}
      ports:
        - port: 9200
{{- end }}
