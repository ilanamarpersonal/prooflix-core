<!doctype html>
<!-- translate="no": browser page translation rewrites text React manages (see src/lib/dom-guard.ts) -->
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Prooflix</title>
    <script>
      // Apply the saved or system theme before first paint.
      try {
        const t = localStorage.getItem("prooflix-theme")
        const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.classList.toggle("dark", dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
